<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b4513"/>
      <stop offset="100%" stop-color="#a0522d"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#daa520"/>
      <stop offset="100%" stop-color="#a0522d"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="1142" cy="654" r="29" fill="#a0522d" opacity="0.15"/>
    <circle cx="344" cy="214" r="34" fill="#a0522d" opacity="0.09"/>
    <circle cx="407" cy="363" r="31" fill="#a0522d" opacity="0.08"/>
    <circle cx="-26" cy="456" r="37" fill="#a0522d" opacity="0.15"/>
    <circle cx="199" cy="403" r="21" fill="#a0522d" opacity="0.09"/>
    <circle cx="1238" cy="439" r="32" fill="#a0522d" opacity="0.19"/>
    <rect x="507" y="507" width="23" height="50" rx="8" fill="#8b4513" opacity="0.07" transform="rotate(40, 190, 290)"/>
    <rect x="998" y="423" width="27" height="96" rx="8" fill="#8b4513" opacity="0.04" transform="rotate(9, 55, 643)"/>
    <rect x="13" y="694" width="43" height="48" rx="8" fill="#8b4513" opacity="0.05" transform="rotate(20, 407, 546)"/>
    <rect x="-28" y="-34" width="78" height="24" rx="8" fill="#8b4513" opacity="0.15" transform="rotate(9, 604, 32)"/>
    <rect x="428" y="503" width="40" height="49" rx="8" fill="#8b4513" opacity="0.09" transform="rotate(20, 957, 531)"/>
    <rect x="1113" y="399" width="85" height="92" rx="8" fill="#8b4513" opacity="0.09" transform="rotate(16, 701, 453)"/>
    <rect x="868" y="307" width="90" height="96" rx="8" fill="#8b4513" opacity="0.10" transform="rotate(12, 442, 489)"/>
    <rect x="183" y="77" width="62" height="67" rx="8" fill="#8b4513" opacity="0.06" transform="rotate(10, 785, 204)"/>
    <polygon points="556,609 637,771 475,771" fill="#a0522d" opacity="0.05"/>
    <polygon points="1168,101 1267,299 1069,299" fill="#a0522d" opacity="0.07"/>
    <polygon points="80,358 108,414 52,414" fill="#a0522d" opacity="0.08"/>
    <polygon points="493,348 570,502 416,502" fill="#a0522d" opacity="0.11"/>

  <!-- Wave at bottom -->
  <path d="M0,590 C360,610 840,570 1200,590 L1200,630 L0,630Z" fill="#a0522d" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    SEO 오토파일럿 가격
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    마포 — 신작애니
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#daa520" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#daa520" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    마포 SEO 오토파일럿 가격 — 신작애니
  </text>
</svg>